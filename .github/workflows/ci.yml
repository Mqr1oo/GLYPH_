name: CI

# Ce face: la fiecare push pe GitHub, doua verificari automate.
#
#   1. "Teste native"      - ruleaza logica pura (timp, distanta, protocol,
#                            cripto, KML) pe un calculator din cloud. Cateva
#                            secunde. Asta prinde regresii de logica.
#
#   2. "Compilare firmware"- verifica daca sketch-ul chiar compileaza pentru
#                            ESP32-S3. Cateva minute. Asta prinde clasa
#                            "nu mai compileaza" inainte sa ramai cu ea in repo.
#
# Nu trebuie sa faci nimic ca sa porneasca. Rezultatul apare in tab-ul
# "Actions" de pe GitHub si ca bifa verde sau X rosu langa fiecare commit.

on:
  push:
  pull_request:
  workflow_dispatch:   # buton de pornire manuala, din tab-ul Actions

env:
  # Versiunea de platforma ESP32 folosita la compilare.
  #
  # Pune aici EXACT versiunea pe care o ai in Arduino IDE:
  # Tools -> Board -> Boards Manager -> cauta "esp32" -> scrie versiunea instalata.
  # Acum e potrivita cu Arduino IDE-ul tau: 3.3.7.
  #
  # Daca versiunea nu exista in index, workflow-ul nu se opreste: instaleaza
  # ultima disponibila si lasa un avertisment vizibil, ca sa vezi diferenta.
  ESP32_CORE_VERSION: "3.3.7"

jobs:
  tests:
    name: Teste native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instaleaza mbedtls
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev

      - name: Ruleaza testele
        run: |
          chmod +x test/run.sh
          ./test/run.sh

  build:
    name: Compilare firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instaleaza arduino-cli
        uses: arduino/setup-arduino-cli@v1

      - name: Ce versiuni folosim
        # Primul lucru pe care il vrei intr-un log cand ceva pica: din ce s-a plecat.
        run: |
          arduino-cli version
          gcc --version | head -1

      - name: Instaleaza platforma ESP32
        run: |
          # --overwrite: fara el, comanda pica daca exista deja o configurare.
          arduino-cli config init --overwrite

          # Indexul STABIL al Espressif. Cel de pe gh-pages e pentru versiuni de
          # dezvoltare si nu contine intotdeauna versiunile 2.x - de aceea o
          # versiune fixata poate sa nu fie gasita acolo.
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

          echo "--- versiuni ESP32 disponibile ---"
          arduino-cli core search esp32 --all 2>&1 | head -40 || true
          echo "----------------------------------"

          if arduino-cli core install "esp32:esp32@${ESP32_CORE_VERSION}"; then
            echo "Instalat esp32:esp32@${ESP32_CORE_VERSION}"
          else
            echo "::warning title=Versiune indisponibila::esp32:esp32@${ESP32_CORE_VERSION} nu exista in index. Instalez ultima versiune. Compilarea poate diferi de Arduino IDE-ul tau."
            arduino-cli core install esp32:esp32
          fi

          arduino-cli core list

      - name: Instaleaza bibliotecile
        run: |
          # Instalarea direct din git nu e permisa implicit.
          arduino-cli config set library.enable_unsafe_install true

          # Dependintele Adafruit, instalate explicit: rezolvarea automata a
          # dependintelor difera intre versiunile de arduino-cli, iar cand esueaza
          # eroarea apare abia la compilare, ca "header negasit".
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "Adafruit Unified Sensor"
          arduino-cli lib install "Adafruit GFX Library"

          arduino-cli lib install "RadioLib"
          arduino-cli lib install "SparkFun u-blox GNSS Arduino Library"
          arduino-cli lib install "Adafruit SHT4x Library"
          arduino-cli lib install "Adafruit LSM6DS"
          arduino-cli lib install "Adafruit LIS3MDL"
          arduino-cli lib install "U8g2_for_Adafruit_GFX"
          arduino-cli lib install "Button2"
          arduino-cli lib install "Modulino"

          # GxEPD nu e in indexul oficial - se ia direct din surse.
          arduino-cli lib install --git-url https://github.com/ZinggJM/GxEPD.git

          arduino-cli lib list

      - name: Pregateste folderul de sketch
        run: |
          # Arduino cere ca folderul sa aiba EXACT numele fisierului principal.
          # La noi fisierul principal e GLYPH_.ino, iar folderul se numeste
          # Arduino/ - deci copiem intr-un folder cu numele corect, doar pentru
          # compilare. Fisierele din repo raman neatinse.
          mkdir -p build/GLYPH_
          cp Arduino/* build/GLYPH_/
          ls build/GLYPH_/

      - name: Compileaza
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --warnings default \
            build/GLYPH_ 2>&1 | tee compile.log

      # Logul complet al unei rulari cere autentificare ca sa fie citit, dar
      # adnotarile si rezumatul sunt vizibile public pe pagina rularii.
      # Cand ceva pica, punem eroarea in amandoua, ca sa poata fi vazuta fara cont.
      - name: Publica eroarea
        if: failure()
        run: |
          if [ -f compile.log ]; then
            # Primele erori de compilare, ca adnotari - apar sus pe pagina rularii.
            grep -E "error:|fatal error:" compile.log | head -10 | while IFS= read -r line; do
              echo "::error title=Eroare de compilare::${line}"
            done

            {
              echo "## Compilarea a esuat"
              echo
              echo '```'
              grep -E "error:|fatal|No such file|not found" compile.log | head -40 || echo "(nicio linie de eroare extrasa)"
              echo '```'
              echo
              echo "### Ultimele 60 de linii"
              echo '```'
              tail -60 compile.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=Esec inainte de compilare::Instalarea platformei sau a bibliotecilor nu a reusit."
            echo "## A esuat inainte de compilare" >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### Platforme instalate"
            echo '```'
            arduino-cli core list 2>&1 || true
            echo '```'
            echo "### Biblioteci instalate"
            echo '```'
            arduino-cli lib list 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
